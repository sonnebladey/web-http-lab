services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/notes

    depends_on: 
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: notes
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro 

    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U app -d notes"]
      interval: 5s
      timeout: 3s
      retries: 5 


volumes:
  postgres_data: